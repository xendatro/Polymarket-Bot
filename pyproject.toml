[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-agent"
version = "0.1.0"
description = "Claude-driven paper/live trading loop for Polymarket US"
requires-python = ">=3.10"
dependencies = [
  "polymarket-us>=0.1.2",
  "discord.py>=2.3",
  "filelock>=3.13",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "streamlit>=1.32",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pm*", "runner*", "bot*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
